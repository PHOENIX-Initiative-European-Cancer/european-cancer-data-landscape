id: phoenix.eu.cancer-landscape
canonical: https://phoenix-initiative-european-cancer.github.io/european-cancer-data-landscape
name: EuropeanCancerDataLandscape
title: European Cancer Data Landscape
description: >-
  Country-by-country survey of the digital cancer data landscape in Europe: national
  FHIR base guides, oncology FHIR specifications, cancer registries and their input
  formats, terminologies and their versions, public datasets, cancer research
  infrastructure and non-FHIR digital assets. Compiled by the PHOENIX Initiative to
  inform the HL7 Europe Common Cancer Data Model (ECCDM).
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#150 "Europe"
publisher:
  name: PHOENIX Initiative (European Cancer Accelerator)
  url: https://github.com/PHOENIX-Initiative-European-Cancer
copyright: >-
  Released under CC0 1.0. The survey compiles public sources; every statement carries its
  source URL in the country pages. No clinical or patient data.

parameters:
  show-inherited-invariants: false
  path-resource:
    - input/resources

